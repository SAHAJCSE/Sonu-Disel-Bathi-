<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in preview iframe environments
      window.addEventListener('error', function (event) {
        var msg = String(event.message || '');
        var file = String(event.filename || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('[vite]') ||
          file.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = String(event.reason?.message || event.reason || '');
        if (reason.includes('WebSocket') || reason.includes('[vite]')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
