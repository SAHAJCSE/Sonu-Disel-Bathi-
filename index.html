    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in preview iframe environments
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var WrappedWebSocket = function(url, protocols) {
            try {
              var ws = protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
              ws.addEventListener('error', function(e) {
                try {
                  e.stopImmediatePropagation();
                } catch (err) {}
              }, true);
              return ws;
            } catch (err) {
              // Return a dummy object if WebSocket fails to instantiate (common in some restricted environments)
              console.warn('WebSocket instantiation blocked or failed.');
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {}
              };
            }
          };
          WrappedWebSocket.prototype = NativeWebSocket.prototype;
          WrappedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          WrappedWebSocket.OPEN = NativeWebSocket.OPEN;
          WrappedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          WrappedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = WrappedWebSocket;
        }

        var origError = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(String).join(' ');
          // Specifically ignore the common Vite "WebSocket closed without opened" error
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('closed without opened')) {
            return;
          }
          origError.apply(console, arguments);
        };

        window.addEventListener('error', function (event) {
          var msg = String(event.message || event.error?.message || '');
          var file = String(event.filename || '');
          if (
            msg.includes('WebSocket') ||
            msg.includes('[vite]') ||
            msg.includes('closed without opened') ||
            file.includes('@vite/client')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = String(event.reason?.message || event.reason || '');
          if (reason.includes('WebSocket') || reason.includes('[vite]')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
